<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Sacramento&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #12091f;
      --bg-card: rgba(255, 255, 255, 0.08);
      --primary: #9d4edd;
      --accent: #c77dff;
      --light-accent: #e0aaff;
      --glow: rgba(199, 125, 255, 0.4);
      --text-color: #f3e8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #240046 0%, #10002b 70%, #080016 100%);
      font-family: 'Poppins', sans-serif;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Background Glows */
    .glow-bg {
      position: absolute;
      width: 350px;
      height: 350px;
      background: var(--primary);
      filter: blur(140px);
      border-radius: 50%;
      z-index: 0;
      opacity: 0.5;
      animation: pulse 8s infinite alternate ease-in-out;
    }
    .glow-1 { top: 10%; left: 15%; }
    .glow-2 { bottom: 10%; right: 15%; background: var(--accent); }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.2); opacity: 0.7; }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 650px;
      padding: 2.5rem;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px var(--glow);
      text-align: center;
    }

    .title-main {
      font-family: 'Sacramento', cursive;
      font-size: 3.8rem;
      color: #fff;
      text-shadow: 0 0 15px var(--accent), 0 0 30px var(--primary);
      margin-bottom: 1.5rem;
      line-height: 1.1;
    }

    .gift-box {
      width: 100px;
      height: 100px;
      margin: 1.5rem auto;
      background: linear-gradient(135deg, #7b2cbf, #9d4edd);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 0 20px var(--glow);
      animation: float 3s infinite ease-in-out;
      transition: transform 0.2s ease;
    }

    .gift-box:hover {
      transform: scale(1.08);
    }

    .gift-box i {
      font-size: 3rem;
      color: #fff;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .card-message {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      background: rgba(16, 0, 43, 0.6);
      border-radius: 16px;
      padding: 0 1.5rem;
      border: 1px solid rgba(199, 125, 255, 0.2);
    }

    .card-message.open {
      max-height: 300px;
      opacity: 1;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }

    .card-message p {
      font-size: 1rem;
      line-height: 1.7;
      color: #e0aaff;
    }

    .music-control {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      z-index: 100;
    }

    .music-control i {
      color: var(--accent);
      font-size: 1.2rem;
    }

    .music-control span {
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Background Glow Effects -->
  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>

  <!-- Music Control Button -->
  <div class="music-control" id="musicToggle">
    <i class="fa-solid fa-volume-xmark" id="musicIcon"></i>
    <span id="musicStatus">Tap Box for Music 🎁</span>
  </div>

  <!-- Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <!-- Main Card Container -->
  <div class="container">
    <div class="title-main">Happy Birthday!✨</div>

    <!-- Clickable Gift Icon -->
    <div class="gift-box" id="giftBtn">
      <i class="fa-solid fa-gift"></i>
    </div>

    <!-- Expandable Message -->
    <div class="card-message" id="messageCard">
      <p>
        Wag na mag Review :)
      </p>
    </div>
  </div>

  <script>
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    const musicIcon = document.getElementById('musicIcon');
    const musicStatus = document.getElementById('musicStatus');
    const giftBtn = document.getElementById('giftBtn');
    const messageCard = document.getElementById('messageCard');

    let isPlaying = false;
    const violetColors = ['#9d4edd', '#c77dff', '#e0aaff', '#7b2cbf', '#ffffff'];

    // Function to trigger confetti
    function triggerConfetti(x, y) {
      confetti({
        particleCount: 35,
        spread: 60,
        origin: {
          x: x / window.innerWidth,
          y: y / window.innerHeight
        },
        colors: violetColors
      });
    }

    // Confetti on EVERY click anywhere on screen
    document.addEventListener('click', (e) => {
      triggerConfetti(e.clientX, e.clientY);
    });

    // Pressing Gift Box: Plays Music + Opens Card + Confetti Explosion
    giftBtn.addEventListener('click', (e) => {
      e.stopPropagation();

      // Trigger Confetti
      triggerConfetti(e.clientX, e.clientY);
      confetti({
        particleCount: 100,
        spread: 100,
        origin: { y: 0.6 },
        colors: violetColors
      });

      // Toggle Card Message
      const isOpen = messageCard.classList.toggle('open');

      // Start/Resume or Pause Music based on box state
      if (isOpen) {
        bgMusic.play().then(() => {
          isPlaying = true;
          musicStatus.textContent = "Playing Music 🎵";
          musicIcon.className = "fa-solid fa-music";
        }).catch(err => console.log(err));
      } else {
        bgMusic.pause();
        isPlaying = false;
        musicStatus.textContent = "Tap Box for Music 🎁";
        musicIcon.className = "fa-solid fa-volume-xmark";
      }
    });

    // Manual Toggle Music Button
    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerConfetti(e.clientX, e.clientY);

      if (isPlaying) {
        bgMusic.pause();
        isPlaying = false;
        musicStatus.textContent = "Music Muted";
        musicIcon.className = "fa-solid fa-volume-xmark";
      } else {
        bgMusic.play().then(() => {
          isPlaying = true;
          musicStatus.textContent = "Playing Music 🎵";
          musicIcon.className = "fa-solid fa-music";
        }).catch(err => console.log(err));
      }
    });
  </script>
</body>
</html>
